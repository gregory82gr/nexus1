# Dev-only Grafana datasource provisioning (ADR-038): the local Prometheus that
# scrapes RootCause.Host. See docs/runbooks/local-prometheus-grafana.md.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: nexus1-prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
