services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus1-console:local
    ports:
      - "8080:80"
    environment:
      # Real value once a backend compose stack exists; placeholder today --
      # nothing named "api" is defined in this file or anywhere else in the
      # repo (see header (b)).
      - API_BASE_URL=http://api:8081
